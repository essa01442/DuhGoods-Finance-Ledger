name: Lint

on:
  push:
    branches: [$default-branch]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  setup_and_lint:
    runs-on: macos-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Set yarn version
        run: yarn set version 1.22.18

      - name: Checkout Books
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: yarn

      - name: Lint
        run: yarn lint

      - name: Check Formatting
        run: yarn prettier --check .

      - name: Type check DuhGoods (vue-tsc)
        run: |
          set +e
          yarn vue-tsc --noEmit > vue-tsc.log 2>&1
          set -e
          cat vue-tsc.log
          if grep -E "^(duhgoods/|reports/duhgoods/)" vue-tsc.log; then
            echo "vue-tsc reported errors in duhgoods/ or reports/duhgoods/ — see above."
            exit 1
          fi
          echo "No type errors in duhgoods/ or reports/duhgoods/."
